name: Publish to PyPI

# Runs when a GitHub release is published.
# Configure a Trusted Publisher on pypi.org once
# (Project -> Publishing -> GitHub, workflow: publish.yml, environment: pypi).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
