[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unitconv-yourname"   # change to a unique name for PyPI
version = "0.3.0"
description = "Dependency-free unit and currency converter with a CLI and a Quantity class"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["units", "converter", "currency", "cli", "measurement"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/unitconv"
Issues = "https://github.com/YOUR_USERNAME/unitconv/issues"
Changelog = "https://github.com/YOUR_USERNAME/unitconv/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "ruff", "build"]

[project.scripts]
unitconv = "unitconv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unitconv = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--doctest-modules --doctest-glob='' src tests"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP007", "UP045"]
